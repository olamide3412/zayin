<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Solar Gold Primary Gradient -->
    <linearGradient id="solarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Gold Accent Glow -->
    <linearGradient id="energyBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.8" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Shield -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Subtle Solar Orbital Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="14 10" opacity="0.25" />

  <!-- Stylized Geometric Z & Energy Bolt Nexus -->
  <g filter="url(#glow)">
    <!-- Top Horizontal Bar of 'Z' with beveled terminal -->
    <path d="M 120 148 L 380 148 C 392 148 400 158 396 170 L 372 216 C 368 224 360 228 352 228 L 220 228 L 330 148 Z" fill="url(#solarGold)" />

    <!-- Central Dynamic Diagonal Energy Lightning Slash -->
    <polygon points="384,156 188,348 248,348 136,368 180,270 236,270 348,156" fill="url(#energyBeam)" />

    <!-- Bottom Horizontal Bar of 'Z' with forward launch -->
    <path d="M 160 284 L 292 284 C 300 284 308 288 312 296 L 336 342 C 340 354 332 364 320 364 L 132 364 C 120 364 112 354 116 342 L 140 296 C 144 288 152 284 160 284 Z" fill="url(#solarGold)" />

    <!-- Core Starlink / Solar Spark Centerpiece -->
    <polygon points="256,204 266,242 304,252 266,262 256,300 246,262 208,252 246,242" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
